<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#071420">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lịch xem</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
if (window.Telegram?.WebApp) {
  try { document.body.classList.add('in-telegram'); } catch(e) {
    document.addEventListener('DOMContentLoaded', function() {
      document.body.classList.add('in-telegram');
    });
  }
  const tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  tg.setHeaderColor('#071420');
  tg.setBackgroundColor('#071420');
  // Fullscreen (Bot API 8.0+) - hide Telegram header buttons
  function tryFullscreen() {
    try {
      if (tg.requestFullscreen && !tg.isFullscreen) tg.requestFullscreen();
      // Also try to set header/bg to match (hides visual separation)
      if (tg.setHeaderColor) tg.setHeaderColor('#071420');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#071420');
    } catch(e) {}
  }
  tryFullscreen();
  document.addEventListener('pointerdown', tryFullscreen, { once: true });
  // Disable vertical swipes closing the app
  if (tg.disableVerticalSwipes) { try { tg.disableVerticalSwipes(); } catch(e) {} }
}
</script>
<style>
body{margin:0;background:#071420;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer}
input::placeholder{color:#7f90a1}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
#cards{padding-bottom:96px}#cards:empty::after{content:'Đang tải...';display:block;text-align:center;color:#7f90a1;padding:48px 16px;font:400 14px/20px 'Be Vietnam Pro',sans-serif}
</style>

<style>
/* Telegram + iOS safe areas */
.main-wrap { padding-top: env(safe-area-inset-top); }
</style>

<style>
.sticky-header { position: sticky; top: 0; z-index: 50; background: #071420; }
</style>

<style>
/* Hide design back/close buttons when in Telegram Mini App */
body.in-telegram .design-nav-btn { display: none !important; }
</style>
</head>
<body>
<div class="main-wrap" style="width:100%;max-width:420px;margin:0 auto;min-height:100vh;background:#071420">
<div class="sticky-header">
<header style="height:52px;padding:0 8px;display:flex;align-items:center;justify-content:center;background:#071420;border-bottom:1px solid #243241;gap:8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#89ceff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/></svg>
<h1 style="margin:0;font:600 16px/24px 'Be Vietnam Pro';color:#d7e4f4">Lịch xem</h1>
<span id="vw-count" style="padding:2px 9px;border-radius:9999px;background:rgba(137,206,255,0.12);color:#89ceff;font:600 12px/16px 'Be Vietnam Pro'">0</span>
</header>
</div>
<div style="padding:12px 16px"><div id="vw-list" style="display:flex;flex-direction:column;gap:10px;padding-bottom:96px"></div></div>
<nav style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;height:64px;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:#101d28;border-top:1px solid #243241;z-index:100">
<a href="listings.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#93a3b3;font:500 11px/14px 'Be Vietnam Pro';text-decoration:none">Căn hộ</a>
<a href="clients.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#93a3b3;font:500 11px/14px 'Be Vietnam Pro';text-decoration:none">Khách</a>
<a href="viewings.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#89ceff;font:600 11px/14px 'Be Vietnam Pro';text-decoration:none">Lịch xem</a>
<a href="deals.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#93a3b3;font:500 11px/14px 'Be Vietnam Pro';text-decoration:none">Hoa hồng</a>
</nav>
</div>
<script>
(function(){
  const tg = window.Telegram?.WebApp;
  const uid = tg?.initDataUnsafe?.user?.id || '';
  function apiUrl(p){ let u=p+'?'; if(uid) u+='tg_user_id='+uid+'&'; if(tg?.initData) u+='init_data='+encodeURIComponent(tg.initData); return u; }
  function esc(s){ return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  async function load(){
    const box=document.getElementById('vw-list'), cnt=document.getElementById('vw-count');
    box.innerHTML='<div style="text-align:center;color:#7f90a1;padding:48px 16px">Đang tải...</div>';
    try{
      const res=await fetch(apiUrl('/api/viewings')); if(!res.ok) throw new Error(res.status);
      const data=await res.json(); const items=data.viewings||[];
      if(cnt) cnt.textContent=items.length;
      if(!items.length){ box.innerHTML='<div style="text-align:center;color:#7f90a1;padding:48px 16px">Chưa có lịch xem nào.</div>'; return; }
      box.innerHTML=items.map(v=>'<div style="border-radius:14px;background:#14212d;border:1px solid #243241;padding:12px">'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:6px"><h3 style="margin:0;font:600 15px/22px \'Be Vietnam Pro\';color:#d7e4f4">'+esc(v.client_name||'Khách')+'</h3>'
        +'<span style="font:500 12px/16px \'Be Vietnam Pro\';color:#fabc4c">'+esc(v.status||'')+'</span></div>'
        +'<p style="margin:0;font:400 13px/18px \'Be Vietnam Pro\';color:#93a3b3">📅 '+esc(v.scheduled_at||'Chưa đặt')+'</p>'
        +'<p style="margin:4px 0 0;font:400 13px/18px \'Be Vietnam Pro\';color:#93a3b3">'+(v.listing_ids||[]).length+' căn</p>'
        +(v.notes?'<p style="margin:6px 0 0;font:400 12px/16px \'Be Vietnam Pro\';color:#7f90a1">'+esc(v.notes)+'</p>':'')
        +'</div>').join('');
    }catch(e){ box.innerHTML='<div style="text-align:center;color:#ffb4ab;padding:48px 16px">Lỗi: '+esc(e.message)+'</div>'; }
  }
  load();
})();
</script>
</body>
</html>
