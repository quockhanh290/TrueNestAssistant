<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#071420">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Khách hàng</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
if (window.Telegram?.WebApp) {
  try { document.body.classList.add('in-telegram'); } catch(e) {
    document.addEventListener('DOMContentLoaded', function() {
      document.body.classList.add('in-telegram');
    });
  }
  const tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  tg.setHeaderColor('#071420');
  tg.setBackgroundColor('#071420');
  // Fullscreen (Bot API 8.0+) - hide Telegram header buttons
  function tryFullscreen() {
    try {
      if (tg.requestFullscreen && !tg.isFullscreen) tg.requestFullscreen();
      // Also try to set header/bg to match (hides visual separation)
      if (tg.setHeaderColor) tg.setHeaderColor('#071420');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#071420');
    } catch(e) {}
  }
  tryFullscreen();
  document.addEventListener('pointerdown', tryFullscreen, { once: true });
  // Disable vertical swipes closing the app
  if (tg.disableVerticalSwipes) { try { tg.disableVerticalSwipes(); } catch(e) {} }
}
</script>
<style>
body{margin:0;background:#071420;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer}
input::placeholder{color:#7f90a1}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
#cards{padding-bottom:96px}#cards:empty::after{content:'Đang tải...';display:block;text-align:center;color:#7f90a1;padding:48px 16px;font:400 14px/20px 'Be Vietnam Pro',sans-serif}
</style>

<style>
/* Telegram + iOS safe areas */
.main-wrap { padding-top: env(safe-area-inset-top); }
</style>

<style>
.sticky-header { position: sticky; top: 0; z-index: 50; background: #071420; }
</style>

<style>
/* Hide design back/close buttons when in Telegram Mini App */
body.in-telegram .design-nav-btn { display: none !important; }
</style>
</head>
<body>
<div class="main-wrap" style="width:100%;max-width:420px;margin:0 auto;min-height:100vh;background:#071420">
<div class="sticky-header">
<header style="flex:none;height:52px;padding:0 8px;display:flex;align-items:center;justify-content:space-between;background:#071420;border-bottom:1px solid #243241">
<div style="flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#89ceff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
<h1 style="margin:0;font:600 16px/24px 'Be Vietnam Pro',sans-serif;color:#d7e4f4;white-space:nowrap">Khách hàng</h1>
<span id="client-count" style="flex:none;padding:2px 9px;border-radius:9999px;background:rgba(137,206,255,0.12);color:#89ceff;font:600 12px/16px 'Be Vietnam Pro',sans-serif">0</span>
</div>
<button type="button" id="btn-add" aria-label="Thêm khách" style="flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:#89ceff;font:700 24px/1 'Be Vietnam Pro'">+</button>
</header>
</div>

<div style="padding:12px 16px;display:flex;flex-direction:column;gap:12px">
<div id="clients-list" style="display:flex;flex-direction:column;gap:10px;padding-bottom:96px"></div>
</div>

<nav style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;height:64px;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:#101d28;border-top:1px solid #243241;z-index:100">
<a href="listings.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#93a3b3;font:500 11px/14px 'Be Vietnam Pro';text-decoration:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/></svg>Căn hộ</a>
<a href="clients.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#89ceff;font:600 11px/14px 'Be Vietnam Pro';text-decoration:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Khách</a>
<a href="viewings.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#93a3b3;font:500 11px/14px 'Be Vietnam Pro';text-decoration:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/></svg>Lịch xem</a>
<a href="deals.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#93a3b3;font:500 11px/14px 'Be Vietnam Pro';text-decoration:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/></svg>Hoa hồng</a>
</nav>
</div>

<script>
(function(){
  const tg = window.Telegram?.WebApp;
  const uid = tg?.initDataUnsafe?.user?.id || '';
  function apiUrl(p){
    let u = p + '?limit=50';
    if (uid) u += '&tg_user_id=' + uid;
    if (tg?.initData) u += '&init_data=' + encodeURIComponent(tg.initData);
    return u;
  }
  function esc(s){ return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function statusColor(s){
    const m = {'new':'#89ceff','contacted':'#fabc4c','viewing':'#fabc4c','negotiating':'#fabc4c','closed':'#7bdc75','lost':'#8596a7'};
    return m[s] || '#93a3b3';
  }
  async function load(){
    const box = document.getElementById('clients-list');
    const cnt = document.getElementById('client-count');
    box.innerHTML = '<div style="text-align:center;color:#7f90a1;padding:48px 16px">Đang tải...</div>';
    try{
      const res = await fetch(apiUrl('/api/clients'));
      if(!res.ok) throw new Error(res.status);
      const data = await res.json();
      const items = data.clients || [];
      if(cnt) cnt.textContent = items.length;
      if(!items.length){
        box.innerHTML = '<div style="text-align:center;color:#7f90a1;padding:48px 16px">Chưa có khách hàng nào.<br><span style="font-size:12px">Nhấn + để thêm khách mới.</span></div>';
        return;
      }
      box.innerHTML = items.map(c => {
        const sc = statusColor(c.status);
        return '<div style="border-radius:14px;background:#14212d;border:1px solid #243241;padding:12px">'
          + '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px">'
          + '<h3 style="margin:0;font:600 15px/22px \'Be Vietnam Pro\';color:#d7e4f4">' + esc(c.name) + '</h3>'
          + '<span style="flex:none;padding:2px 8px;border-radius:9999px;background:rgba(137,206,255,0.1);color:' + sc + ';font:600 11px/16px \'Be Vietnam Pro\'">' + esc(c.status_vi || c.status) + '</span>'
          + '</div>'
          + (c.req_summary ? '<p style="margin:0 0 6px;font:400 13px/18px \'Be Vietnam Pro\';color:#93a3b3">' + esc(c.req_summary) + '</p>' : '')
          + (c.phone ? '<a href="tel:' + esc(c.phone) + '" style="font:500 13px/18px \'Be Vietnam Pro\';color:#89ceff;text-decoration:none">📞 ' + esc(c.phone) + '</a>' : '')
          + '</div>';
      }).join('');
    }catch(e){
      box.innerHTML = '<div style="text-align:center;color:#ffb4ab;padding:48px 16px">Lỗi: ' + esc(e.message) + '</div>';
    }
  }
  document.getElementById('btn-add').addEventListener('click', () => {
    const name = prompt('Tên khách:');
    if(!name) return;
    const phone = prompt('SĐT:') || '';
    const req = prompt('Nhu cầu (VD: 2PN Hải Châu dưới 12tr):') || '';
    fetch(apiUrl('/api/clients'), {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name, phone, requirements_raw: req})
    }).then(r => r.json()).then(() => load()).catch(e => alert('Lỗi: ' + e.message));
  });
  load();
})();
</script>
</body>
</html>
