<script>
if (window.Telegram?.WebApp) {
  const tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  tg.setHeaderColor('#071420');
  tg.setBackgroundColor('#071420');
  // Fullscreen (Bot API 8.0+)
  function tryFullscreen() {
    if (tg.requestFullscreen && !tg.isFullscreen) tg.requestFullscreen();
  }
  tryFullscreen();
  document.addEventListener('pointerdown', tryFullscreen, { once: true });
}

<script>
(function() {
  const tg = window.Telegram?.WebApp;
  const uid = tg?.initDataUnsafe?.user?.id || '';
  
  function apiUrl(p) {
    let u = p + '?limit=50';
    if (uid) u += '&tg_user_id=' + uid;
    if (tg?.initData) u += '&init_data=' + encodeURIComponent(tg.initData);
    return u;
  }
  function esc(s) {
    return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function fmtPrice(v) {
    if (!v) return '';
    const tr = v / 1000000;
    return tr.toFixed(tr % 1 ? 1 : 0).replace('.', ',') + ' tr';
  }
  
  // SVG icons (from design)
  const ICONS = {
    pin: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>',
    bed: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7f90a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16"></path><path d="M2 8h18a2 2 0 0 1 2 2v10"></path><path d="M2 17h20"></path><path d="M6 8v9"></path></svg>',
    bath: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7f90a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6 6.5 3.5a1.5 1.5 0 0 0-1-1C4.7 2.5 4 3.2 4 4v2"></path><path d="M2 12h20"></path><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg>',
    area: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7f90a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.3 8.7 8.7 21.3c-1 1-2.5 1-3.4 0l-2.6-2.6c-1-1-1-2.5 0-3.4L15.3 2.7c1-1 2.5-1 3.4 0l2.6 2.6c1 1 1 2.5 0 3.4Z"></path></svg>',
  };
  
  function scoreColor(s) {
    if (s >= 80) return '#7bdc75';
    if (s >= 50) return '#fabc4c';
    return '#ffb4ab';
  }
  
  function cardHtml(l) {
    const p = l.parsed || l;
    const score = l.quality_score || 0;
    const sc = scoreColor(score);
    const img = (l.photo_urls || [])[0] || '';
    const title = esc(l.title || 'Chưa có tiêu đề');
    const price = fmtPrice(p.price_vnd || l.price_vnd);
    const district = esc(p.district || p.building_name || '');
    const br = l.bedroom_label || (p.bedrooms ? p.bedrooms + 'PN' : '');
    const wc = p.bathrooms ? p.bathrooms + 'WC' : '';
    const area = p.area_m2 ? p.area_m2 + ' m²' : '';
    const st = (l.status || '') === 'rented' ? 'Đã thuê' : 'Còn trống';
    const stColor = (l.status || '') === 'rented' ? '#8596a7' : '#7bdc75';
    const amenities = (l.amenities || p.amenities || []).slice(0, 3);
    const highlights = (p.highlights || []).slice(0, 2);
    
    return '<article style="display:flex;flex-direction:column;overflow:hidden;border-radius:14px;background:#14212d;border:1px solid #243241">' +
    '<div style="display:flex;gap:12px;padding:12px 12px 10px">' +
      '<div style="position:relative;flex:none;width:128px;min-height:108px;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:10px;background:#1b2d3d;color:#6f879c;overflow:hidden">' +
        (img ? '<img src="' + esc(img) + '" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">' : '') +
        '<span style="position:absolute;top:6px;right:6px;display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:6px;background:#0b1823;color:' + sc + ';font:600 11px/14px \'JetBrains Mono\',monospace;z-index:2"><span style="width:6px;height:6px;border-radius:9999px;background:currentColor"></span>' + score + '</span>' +
        '<span style="position:absolute;left:6px;bottom:6px;padding:2px 6px;border-radius:6px;background:#17302c;border:1px solid rgba(123,220,117,0.5);color:' + stColor + ';font:600 10px/14px \'Be Vietnam Pro\',sans-serif;letter-spacing:0.02em;white-space:nowrap;z-index:2">' + st + '</span>' +
      '</div>' +
      '<div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">' +
          '<h2 style="flex:1;min-width:0;margin:0;font:600 14px/22px \'Be Vietnam Pro\',sans-serif;color:#d7e4f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + title + '</h2>' +
          '<span style="flex:none;font:700 18px/22px \'Space Grotesk\',sans-serif;color:#89ceff;white-space:nowrap">' + price + '</span>' +
        '</div>' +
        (district ? '<div style="display:flex;align-items:center;gap:4px;color:#93a3b3;font:400 13px/18px \'Be Vietnam Pro\',sans-serif">' + ICONS.pin + '<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + district + '</span></div>' : '') +
        '<div style="display:flex;align-items:center;gap:10px;color:#c3cfdb;font:500 12px/16px \'Be Vietnam Pro\',sans-serif;white-space:nowrap">' +
          (br ? '<span style="display:flex;align-items:center;gap:4px">' + ICONS.bed + esc(br) + '</span>' : '') +
          (wc ? '<span style="display:flex;align-items:center;gap:4px">' + ICONS.bath + esc(wc) + '</span>' : '') +
          (area ? '<span style="display:flex;align-items:center;gap:4px">' + ICONS.area + esc(area) + '</span>' : '') +
        '</div>' +
        (amenities.length ? '<div style="display:flex;align-items:center;gap:8px;color:#8596a7;font:400 12px/16px \'Be Vietnam Pro\',sans-serif;white-space:nowrap;overflow:hidden">' +
          amenities.map(a => '<span>' + esc(a) + '</span>').join('<span style="color:#4d6073">·</span>') + '</div>' : '') +
      '</div>' +
    '</div>' +
    (highlights.length ? '<div style="padding:0 12px 10px;display:flex;align-items:center;gap:8px"><span style="color:#b6c2cf;font:400 12px/18px \'Be Vietnam Pro\',sans-serif">' + highlights.map(esc).join(' · ') + '</span></div>' : '') +
    '</article>';
  }
  
  async function load() {
    const box = document.getElementById('cards');
    try {
      const res = await fetch(apiUrl('/api/listings'));
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      const items = data.items || [];
      if (!items.length) {
        box.innerHTML = '<div style="text-align:center;color:#7f90a1;padding:48px 16px">Chưa có căn nào.</div>';
        return;
      }
      box.innerHTML = items.map(cardHtml).join('');
    } catch(e) {
      box.innerHTML = '<div style="text-align:center;color:#7f90a1;padding:48px 16px">Không tải được. Mở lại từ bot nhé.</div>';
    }
  }
  
  // Filter chips
  document.querySelectorAll('[data-f]').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('[data-f]').forEach(x => { x.style.color = '#93a3b3'; });
      b.style.color = '#d7e4f4';
      tg?.HapticFeedback?.impactOccurred('light');
      // TODO: apply filter
      load();
    });
  });
  
  load();
})();
</script>
