<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#071420">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Quản lý căn</title>
<!--
  Giao diện v2 (route /v2/), ba tầng:
    1. tokens.css (+ fonts.css)  - design tokens
    2. api.js                    - gọi API, không đụng DOM
    3. tệp này + app.css + ui.js + tabs.js + listings.js - phần trình bày
  Đường dẫn tuyệt đối /static/v2/... vì server chỉ phục vụ "/v2/" cho riêng trang này.
-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/v2/fonts.css">
<link rel="stylesheet" href="/static/v2/tokens.css">
<link rel="stylesheet" href="/static/v2/app.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar__row">
      <button type="button" class="icon-btn design-nav-btn" id="btn-back" aria-label="Quay lại"><span class="icon-btn__disc"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></span></button>
      <div class="topbar__title">
        <span id="topbar-icon" style="display:flex"></span>
        <h1 id="topbar-title">Quản lý căn</h1>
        <span class="count-pill" id="topbar-count" aria-live="polite" hidden></span>
      </div>
      <button type="button" class="icon-btn design-nav-btn" id="btn-close" aria-label="Đóng"><span class="icon-btn__disc"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span></button>
    </div>
  </header>

  <main>
    <section class="view" data-view="listings" aria-label="Căn hộ">
      <div class="toolbar">
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <input type="search" id="search" aria-label="Tìm theo tên hoặc khu vực" placeholder="Tìm theo tên, khu vực…" autocomplete="off" enterkeyhint="search">
        </label>
        <button type="button" class="filter-btn" id="filter-btn" aria-label="Bộ lọc">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"></line><line x1="10" x2="3" y1="4" y2="4"></line><line x1="21" x2="12" y1="12" y2="12"></line><line x1="8" x2="3" y1="12" y2="12"></line><line x1="21" x2="16" y1="20" y2="20"></line><line x1="12" x2="3" y1="20" y2="20"></line><line x1="14" x2="14" y1="2" y2="6"></line><line x1="8" x2="8" y1="10" y2="14"></line><line x1="16" x2="16" y1="18" y2="22"></line></svg>
          <span class="filter-btn__badge" id="filter-badge" hidden></span>
        </button>
      </div>
      <!-- Chỉ hiện khi có bộ lọc đang chọn -->
      <div class="chips-row" id="chips-row" hidden>
        <div class="chips noscroll" id="chips"></div>
        <button type="button" class="chips-clear" id="chips-clear">Xoá tất cả</button>
      </div>
      <div class="list" id="listings-list" aria-live="polite"><div class="state" role="status">Đang tải…</div></div>
    </section>

    <section class="view view--plain" data-view="clients" aria-label="Khách" hidden>
      <div class="list" id="clients-list"></div>
    </section>
    <section class="view view--plain" data-view="viewings" aria-label="Lịch xem" hidden>
      <div class="list" id="viewings-list"></div>
    </section>
    <section class="view view--plain" data-view="deals" aria-label="Hoa hồng" hidden>
      <div class="list" id="deals-list"></div>
    </section>
  </main>

  <button type="button" class="fab" id="fab-add" aria-label="Thêm căn mới"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>

  <nav class="nav" aria-label="Điều hướng chính">
    <button type="button" data-nav="listings" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path><path d="M10 6h4"></path><path d="M10 10h4"></path><path d="M10 14h4"></path><path d="M10 18h4"></path></svg>Căn hộ</button>
    <button type="button" data-nav="clients"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Khách</button>
    <button type="button" data-nav="viewings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"></rect><line x1="16" x2="16" y1="2" y2="6"></line><line x1="8" x2="8" y1="2" y2="6"></line><line x1="3" x2="21" y1="10" y2="10"></line></svg>Lịch xem</button>
    <button type="button" data-nav="deals"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="12" x="2" y="6" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg>Hoa hồng</button>
  </nav>
</div>

<script>
/* Cầu nối Telegram. Mọi lời gọi đều kiểm tra hàm có tồn tại: ngoài Telegram (trình duyệt thường,
   ?demo=1) window.Telegram.WebApp vẫn có nhưng thiếu initData và nhiều hàm. */
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var body = document.body;
  function call(fn) { try { return fn(); } catch (e) { /* bản Telegram cũ chưa có hàm này */ } }
  document.getElementById('btn-back').addEventListener('click', function () { history.length > 1 ? history.back() : null; });
  document.getElementById('btn-close').addEventListener('click', function () { window.close(); });
  if (!tg || !tg.initData) return;                 // ngoài Telegram: dừng ở đây
  body.classList.add('in-telegram');
  var bg = (getComputedStyle(document.documentElement).getPropertyValue('--c-bg') || '').trim() || '#071420';
  call(function () { tg.ready(); });
  call(function () { tg.expand(); });
  call(function () { tg.setHeaderColor && tg.setHeaderColor(bg); });
  call(function () { tg.setBackgroundColor && tg.setBackgroundColor(bg); });
  call(function () { tg.setBottomBarColor && tg.setBottomBarColor(getComputedStyle(document.documentElement).getPropertyValue('--c-surface-quiet').trim() || bg); });
  call(function () { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); });
  // Toàn màn hình (Bot API 8.0+) chỉ trên điện thoại; bắt buộc có thao tác chạm trên một số bản.
  if (tg.platform === 'android' || tg.platform === 'ios') {
    var fs = function () {
      call(function () { if (tg.requestFullscreen && !tg.isFullscreen) tg.requestFullscreen(); });
    };
    fs();
    document.addEventListener('pointerdown', fs, { once: true });
    if (tg.onEvent) {
      call(function () { tg.onEvent('fullscreenChanged', function () { body.classList.toggle('tg-fullscreen', !!tg.isFullscreen); }); });
    }
    body.classList.toggle('tg-fullscreen', !!tg.isFullscreen);
  }
})();
</script>
<script src="/static/v2/api.js"></script>
<script src="/static/v2/ui.js"></script>
<script src="/static/v2/tabs.js"></script>
<script src="/static/v2/listings.js"></script>
</body>
</html>
