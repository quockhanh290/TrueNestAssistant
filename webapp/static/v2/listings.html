<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Quản lý căn</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
if (window.Telegram?.WebApp) {
  const tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  tg.setHeaderColor('#071420');
  tg.setBackgroundColor('#071420');
}
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #071420; color: #d7e4f4; font-family: 'Be Vietnam Pro', -apple-system, sans-serif; }
  body { display: flex; justify-content: center; min-height: 100vh; }
  .app { width: 100%; max-width: 420px; min-height: 100vh; position: relative; padding-bottom: 88px; }
  ::-webkit-scrollbar { display: none; }
  .noscroll { scrollbar-width: none; }

  /* Header */
  .header { position: sticky; top: 0; z-index: 50; background: #071420; padding: 12px 16px 8px; border-bottom: 1px solid #14212d; }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  .header-title { font-size: 17px; font-weight: 700; }
  .header-count { font-size: 12px; color: #93a3b3; background: #14212d; padding: 3px 10px; border-radius: 9999px; }

  /* Filter bar */
  .filter-bar { display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; }
  .filter-bar.noscroll { scrollbar-width: none; }
  .fchip { flex: none; height: 36px; padding: 0 16px 0 12px; background: none; border: 0; color: #93a3b3;
    font: 500 13px/18px 'Be Vietnam Pro', sans-serif; white-space: nowrap; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .fchip.active { color: #d7e4f4; }
  .fchip .dot { width: 6px; height: 6px; border-radius: 9999px; background: currentColor; }

  /* Cards */
  .cards { display: flex; flex-direction: column; gap: 10px; padding: 4px 16px 0; }
  .card { display: flex; flex-direction: column; overflow: hidden; border-radius: 14px; background: #14212d; border: 1px solid #243241; }
  .card-main { display: flex; gap: 12px; padding: 12px 12px 10px; }
  .card-img { flex: none; width: 96px; height: 96px; border-radius: 10px; object-fit: cover; background: #243241; }
  .card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-title { flex: 1; min-width: 0; font: 600 14px/22px 'Be Vietnam Pro', sans-serif; color: #d7e4f4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-price { flex: none; font: 700 18px/22px 'Space Grotesk', sans-serif; color: #89ceff; white-space: nowrap; }
  .card-loc { display: flex; align-items: center; gap: 4px; color: #93a3b3; font: 400 13px/18px 'Be Vietnam Pro', sans-serif; }
  .card-loc .material-symbols-outlined { font-size: 14px; }
  .card-meta { display: flex; align-items: center; gap: 10px; color: #c3cfdb; font: 500 12px/16px 'Be Vietnam Pro', sans-serif; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px; }
  .tag { font: 500 11px/14px 'Be Vietnam Pro', sans-serif; padding: 4px 10px; border-radius: 9999px;
    background: #182c3d; color: #89ceff; }
  .tag.warn { background: #292c26; color: #fabc4c; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px;
    border-top: 1px solid #1b2d3d; font: 500 12px/16px 'Be Vietnam Pro', sans-serif; color: #93a3b3; }
  .status { display: flex; align-items: center; gap: 6px; }
  .status .dot { width: 7px; height: 7px; border-radius: 9999px; }
  .status.ok { color: #7bdc75; } .status.ok .dot { background: #7bdc75; }
  .status.wait { color: #fabc4c; } .status.wait .dot { background: #fabc4c; }
  .status.done { color: #8596a7; } .status.done .dot { background: #8596a7; }

  /* Bottom nav */
  .nav { position: fixed; bottom: 0; width: 100%; max-width: 420px; z-index: 50;
    background: rgba(11,24,35,.92); backdrop-filter: blur(12px); border-top: 1px solid #1b2d3d;
    padding-bottom: env(safe-area-inset-bottom, 0px); }
  .nav-inner { display: flex; height: 64px; }
  .nav a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; color: #6f879c; text-decoration: none; font-size: 11px; }
  .nav a.active { color: #89ceff; }
  .nav .material-symbols-outlined { font-size: 22px; }
  .empty { text-align: center; color: #7f90a1; padding: 48px 16px; font-size: 14px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <span class="header-title">Quản lý căn</span>
      <span class="header-count" id="listing-count">…</span>
    </div>
  </div>

  <div class="filter-bar noscroll" id="filter-bar">
    <button class="fchip active" data-f="all"><span class="dot"></span>Tất cả</button>
    <button class="fchip" data-f="available"><span class="dot"></span>Còn trống</button>
    <button class="fchip" data-f="rented"><span class="dot"></span>Đã thuê</button>
  </div>

  <div class="cards" id="cards">
    <div class="empty">Đang tải...</div>
  </div>

  <nav class="nav"><div class="nav-inner">
    <a href="#" class="active"><span class="material-symbols-outlined">apartment</span>Căn hộ</a>
    <a href="#" onclick="return false"><span class="material-symbols-outlined">group</span>Khách</a>
    <a href="#" onclick="return false"><span class="material-symbols-outlined">calendar_month</span>Lịch xem</a>
    <a href="#" onclick="return false"><span class="material-symbols-outlined">payments</span>Hoa hồng</a>
  </div></nav>
</div>

<script>
(function() {
  const tg = window.Telegram?.WebApp;
  const uid = tg?.initDataUnsafe?.user?.id || '';

  function apiUrl(path) {
    let u = path + '?limit=50';
    if (uid) u += '&tg_user_id=' + uid;
    if (tg?.initData) u += '&init_data=' + encodeURIComponent(tg.initData);
    return u;
  }
  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function fmtPrice(v) {
    if (!v) return '?';
    return (v / 1000000).toFixed(v % 1000000 ? 1 : 0) + 'tr';
  }
  function statusOf(l) {
    const s = (l.status || '').toLowerCase();
    if (s === 'rented') return { cls: 'done', label: 'Đã thuê' };
    return { cls: 'ok', label: 'Còn trống' };
  }

  let allItems = [];
  let curFilter = 'all';

  async function load() {
    const box = document.getElementById('cards');
    try {
      const res = await fetch(apiUrl('/api/listings'));
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      allItems = data.items || [];
      document.getElementById('listing-count').textContent = (data.total || allItems.length) + ' căn';
      render();
    } catch (e) {
      box.innerHTML = '<div class="empty">Không tải được. Mở lại từ bot nhé.</div>';
    }
  }

  function render() {
    const box = document.getElementById('cards');
    const items = allItems.filter(l => {
      if (curFilter === 'available') return (l.status || '') !== 'rented';
      if (curFilter === 'rented') return (l.status || '') === 'rented';
      return true;
    });
    if (!items.length) {
      box.innerHTML = '<div class="empty">Chưa có căn nào.</div>';
      return;
    }
    box.innerHTML = items.map(l => {
      const p = l.parsed || l;
      const st = statusOf(l);
      const img = (l.photo_urls || [])[0] || '';
      const beds = p.bedrooms ? p.bedrooms + 'PN' : '';
      const area = p.area_m2 ? p.area_m2 + 'm²' : '';
      const tags = (l.amenities || []).slice(0, 4).map(a =>
        '<span class="tag">' + esc(a) + '</span>').join('');
      return '<div class="card">' +
        '<div class="card-main">' +
          (img ? '<img class="card-img" loading="lazy" src="' + esc(img) + '">' : '<div class="card-img"></div>') +
          '<div class="card-body">' +
            '<div class="card-top"><div class="card-title">' + esc(l.title || 'Chưa có tiêu đề') + '</div>' +
            '<div class="card-price">' + fmtPrice(p.price_vnd) + '</div></div>' +
            '<div class="card-loc"><span class="material-symbols-outlined">pin_drop</span>' + esc(p.district || '') + '</div>' +
            '<div class="card-meta"><span>' + esc(beds) + '</span><span>' + esc(area) + '</span></div>' +
          '</div>' +
        '</div>' +
        (tags ? '<div class="card-tags">' + tags + '</div>' : '') +
        '<div class="card-foot"><span class="status ' + st.cls + '"><span class="dot"></span>' + st.label + '</span>' +
        '<span>' + esc(l.freshness || '') + '</span></div>' +
      '</div>';
    }).join('');
  }

  document.querySelectorAll('.fchip').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.fchip').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      curFilter = b.dataset.f;
      tg?.HapticFeedback?.impactOccurred('light');
      render();
    });
  });

  load();
})();
</script>
</body>
</html>
